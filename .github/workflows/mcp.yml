name: AI plugin (MCP)

# Tests the Golden Paw Animate MCP plugin on every change to mcp/, and publishes it
# to npm when run by hand ("Run workflow" with publish ticked) on main.
# Publishing uses npm trusted publishing (no token): on npmjs.com, the package's
# Settings → Trusted Publisher → GitHub Actions is set to ludogx1-cpu / a-new-space /
# mcp.yml. Before each publish, raise the version in mcp/package.json and, to match,
# in plugins/golden-paw-animate (plugin.json and start.js) and .claude-plugin/marketplace.json.
on:
  push:
    branches: [main]
    paths: ['mcp/**', 'plugins/**', '.claude-plugin/**', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['mcp/**', 'plugins/**', '.claude-plugin/**', '.github/workflows/mcp.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this version to npm"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # The Claude plugin folder starts this package the way Claude does (on each OS).
      - run: node test/plugin.js --local

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted publishing (no token) and provenance
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm ci --no-audit --no-fund
      - run: npm publish --access public
